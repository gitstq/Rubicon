name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.21.x', '1.22.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Build
        run: go build -trimpath -o rubicon ./cmd/rubicon
      - name: Smoke test
        shell: bash
        run: |
          ./rubicon --dir .ci-workspace init
          ./rubicon --dir .ci-workspace --now 2026-11-09T10:00:00Z card new \
            --title "Ship v1?" --question "May I tag the release?" \
            --options "A:Ship|high,B:Wait|low" --default B
          ./rubicon --dir .ci-workspace --now 2026-11-09T10:05:00Z decide dc_0001 --choice A --by ci
          ./rubicon --dir .ci-workspace verify
          ./rubicon --dir .ci-workspace lint
          ./rubicon --dir .ci-workspace report --format md

  release-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - name: Cross-compile all platforms
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rubicon-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
